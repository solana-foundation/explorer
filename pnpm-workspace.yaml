packages:
  - packages/*
  - packages/idl-decode/test-anchor-programs/*
  - packages/idl-decode/test-codama-programs/*

autoInstallPeers: true

frozenLockfile: true

catalogs:
  oxc:
    oxfmt: ^0.75.0
    oxlint: ^1.90.0
  storybook:
    '@storybook/addon-a11y': 10.6.5
    '@storybook/addon-docs': 10.6.5
    '@storybook/addon-vitest': 10.6.5
    '@storybook/nextjs-vite': 10.6.5
    '@storybook/react': 10.6.5
    eslint-plugin-storybook: 10.6.5
    storybook: 10.6.5
  tooling:
    '@eslint/js': 9.39.4
    eslint: 9.39.4
    markdownlint-cli2: 0.24.0
    prettier: 3.9.10
    typescript: 5.7.3
  vitest:
    '@vitest/browser': 4.1.12
    '@vitest/browser-playwright': 4.1.12
    '@vitest/coverage-v8': 4.1.12
    jsdom: 26.0.0
    vitest: 4.1.12

ignoreScripts: true

minimumReleaseAge: 20160

# Pin resolution to the public npm registry so it can't silently inherit a
# global/org .npmrc mirror. Scoped keys (e.g. '@my-org') can be added here.
registries:
  default: https://registry.npmjs.org/
