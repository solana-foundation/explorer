packages:
  - packages/*
  - packages/idl-decode/test-anchor-programs/*
  - packages/idl-decode/test-codama-programs/*

autoInstallPeers: true

frozenLockfile: true

catalogs:
  oxc:
    oxfmt: ^0.56.0
    oxlint: ^1.71.0
  storybook:
    '@storybook/addon-a11y': 10.5.7
    '@storybook/addon-docs': 10.5.7
    '@storybook/addon-vitest': 10.5.7
    '@storybook/nextjs-vite': 10.5.7
    '@storybook/react': 10.5.7
    eslint-plugin-storybook: 10.5.7
    storybook: 10.5.7
  tooling:
    '@eslint/js': 10.0.1
    eslint: 9.39.4
    prettier: 3.9.6
    typescript: 5.7.3
  vitest:
    '@vitest/browser': 4.1.10
    '@vitest/browser-playwright': 4.1.10
    '@vitest/coverage-v8': 4.1.10
    jsdom: 26.0.0
    vitest: 4.1.10

ignoreScripts: true

minimumReleaseAge: 20160

minimumReleaseAgeExclude:
  # The `@solana/kit` 8.3.0 upgrade installs these releases before they reach `minimumReleaseAge`.
  # The list names each package instead of '@solana/*' because the pattern also exempts future releases.
  # A spec fails after these releases reach `minimumReleaseAge`.
  - '@solana/accounts'
  - '@solana/addresses'
  - '@solana/assertions'
  - '@solana/codecs'
  - '@solana/codecs-core'
  - '@solana/codecs-data-structures'
  - '@solana/codecs-numbers'
  - '@solana/codecs-strings'
  - '@solana/errors'
  - '@solana/fast-stable-stringify'
  - '@solana/fixed-points'
  - '@solana/functional'
  - '@solana/instruction-plans'
  - '@solana/instructions'
  - '@solana/keys'
  - '@solana/kit'
  - '@solana/kit-plugin-wallet'
  - '@solana/nominal-types'
  - '@solana/offchain-messages'
  - '@solana/options'
  - '@solana/plugin-core'
  - '@solana/plugin-interfaces'
  - '@solana/program-client-core'
  - '@solana/programs'
  - '@solana/promises'
  - '@solana/react'
  - '@solana/rpc'
  - '@solana/rpc-api'
  - '@solana/rpc-parsed-types'
  - '@solana/rpc-spec'
  - '@solana/rpc-spec-types'
  - '@solana/rpc-subscriptions'
  - '@solana/rpc-subscriptions-api'
  - '@solana/rpc-subscriptions-channel-websocket'
  - '@solana/rpc-subscriptions-spec'
  - '@solana/rpc-transformers'
  - '@solana/rpc-transport-http'
  - '@solana/rpc-types'
  - '@solana/signers'
  - '@solana/subscribable'
  - '@solana/sysvars'
  - '@solana/transaction-confirmation'
  - '@solana/transaction-introspection'
  - '@solana/transaction-messages'
  - '@solana/transactions'
  - '@solana/wallet-account-signer'
  - '@solana/wallet-standard-features'

# Pin resolution to the public npm registry so it can't silently inherit a
# global/org .npmrc mirror. Scoped keys (e.g. '@my-org') can be added here.
registries:
  default: https://registry.npmjs.org/
