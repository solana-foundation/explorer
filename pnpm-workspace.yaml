packages:
  - packages/*
  - packages/idl-decode/test-anchor-programs/*
  - packages/idl-decode/test-codama-programs/*

autoInstallPeers: true

frozenLockfile: true

catalogs:
  storybook:
    '@storybook/addon-a11y': 10.2.6
    '@storybook/addon-docs': 10.2.6
    '@storybook/addon-vitest': 10.2.6
    '@storybook/nextjs-vite': 10.2.6
    '@storybook/react': 10.2.6
    eslint-plugin-storybook: 10.2.6
    storybook: 10.2.6
  tooling:
    prettier: 3.5.3
    typescript: 5.7.3
  vitest:
    '@vitest/browser': 4.1.8
    '@vitest/browser-playwright': 4.1.8
    '@vitest/coverage-v8': 4.1.8
    vitest: 4.1.8

ignoreScripts: true

minimumReleaseAge: 20160

# @solana/subscriptions 0.5.0 is the first release built against @solana/kit 7; every older release
# imports `getMinimumBalanceForRentExemption`, which kit 7 removed, and fails at import time. Drop
# this exclusion once 0.5.0 is older than `minimumReleaseAge`.
minimumReleaseAgeExclude:
  - '@solana/subscriptions'

# @onsol/tldparser requires @metaplex-foundation/beet without declaring it, so it resolves only via hoisting.
packageExtensions:
  '@onsol/tldparser':
    dependencies:
      '@metaplex-foundation/beet': '>=0.1.0'
